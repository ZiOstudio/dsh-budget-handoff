name: Publish to npm

# Two ways to trigger:
#   1. push a version tag (v0.2.1, v0.3.0, …) → automatic
#   2. the "Run workflow" button on the Actions tab → manual, one click
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # No `npm install` / `pnpm install` on purpose: `dist/` is committed, so
      # there is nothing to build here. Installing would also pull the
      # @deepseek-ai/* dev dependencies, which the runner has no business
      # fetching just to publish an already-built artifact.
      #
      # This does mean the committed `dist/` must be current. The self-check
      # below runs the compiled tests as a smoke test: if the build were stale
      # or broken, these fail before anything reaches the registry.
      - name: Self-check the committed build
        run: |
          node dist/command.test.js
          node dist/harvest.test.js
          node dist/ledger.test.js
          node dist/pricing.test.js
          node dist/snapshot.test.js

      # Diagnostic: a 404 on PUT usually means the token is missing, not that the
      # name is taken. npm answers 404 rather than 401/403 for an unauthenticated
      # PUT on purpose, so the registry cannot be probed for which names exist.
      # This step says which of the two it is, without printing the token.
      - name: Diagnose auth
        run: |
          echo "length: ${#NODE_AUTH_TOKEN}"
          echo "prefix: ${NODE_AUTH_TOKEN:0:4}..."
          if printf '%s' "$NODE_AUTH_TOKEN" | grep -qE '^[[:space:]]|[[:space:]]$'; then
            echo "whitespace: *** TOKEN HAS LEADING OR TRAILING WHITESPACE ***"
          else
            echo "whitespace: clean"
          fi
          echo "--- npm config file actually in use ---"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset>}"
          cat "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" 2>/dev/null | sed 's/_authToken=.*/_authToken=REDACTED/' || echo "(none readable)"
          echo "--- whoami ---"
          npm whoami 2>&1 || echo "(whoami failed)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Idempotent on purpose: re-pushing an existing tag (or running the
      # workflow twice) used to end in
      #   npm error code E403 … You cannot publish over the previously
      #   published versions: 0.2.0
      # which reads like a broken token but is just a duplicate version.
      # Skipping when the version is already on the registry keeps re-runs green.
      - name: Publish
        run: |
          name=$(npm pkg get name | tr -d '"')
          version=$(npm pkg get version | tr -d '"')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version 已在 npm 上，跳过发布。"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
